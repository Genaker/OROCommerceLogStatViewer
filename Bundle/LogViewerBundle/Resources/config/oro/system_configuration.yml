system_configuration:
    groups:
        genaker_log_viewer_group:
            title: 'Log Viewer & Monitoring'
            icon:  fa-file-text-o
            priority: 200
        genaker_log_viewer_settings:
            title: 'Log Viewer'
            priority: 100
        genaker_perf_settings:
            title: 'Performance Monitoring'
            priority: 90
        genaker_sql_settings:
            title: 'SQL Issue Tracker'
            priority: 80
        genaker_browser_console_settings:
            title: 'Browser Console Logger'
            priority: 70
        genaker_db_log_settings:
            title: 'Database Log Handler'
            priority: 60

    fields:
        genaker_log_viewer.enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Log Viewer'
                tooltip: 'Disable on production to prevent log file exposure.'
            priority: 10

        genaker_log_viewer.lines_per_page:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label: 'Default Lines Per Page'
                attr:
                    min: 10
                    max: 1000
            priority: 20

        genaker_log_viewer.perf_dashboard_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Server Monitoring'
                tooltip: 'Enable real-time server metrics collection and dashboard. Disable to reduce Redis load.'
            priority: 30

        genaker_log_viewer.perf_report_interval:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label: 'Metrics Report Interval (seconds)'
                tooltip: 'How often each instance reports metrics to Redis. Lower = more frequent updates, higher Redis load.'
                attr:
                    min: 5
                    max: 300
            priority: 40

        genaker_log_viewer.perf_http_reporting:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'HTTP Listener Reporting'
                tooltip: 'Report metrics on kernel.terminate (after HTTP response sent). Recommended for web servers.'
            priority: 50

        genaker_log_viewer.perf_mq_reporting:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Message Queue Reporting'
                tooltip: 'Report metrics from RabbitMQ consumers. Recommended for background workers.'
            priority: 60

        genaker_log_viewer.perf_mq_trigger:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\ChoiceType
            ui_only:   true
            options:
                label: 'MQ Trigger Mode'
                tooltip: 'When to report metrics from MQ consumers. "after" gives more frequent updates as it reports after each message.'
                choices:
                    'Before processing message': before
                    'After processing message': after
                    'Both before and after': both
            priority: 70

        genaker_log_viewer.http_perf_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Request Performance Tracking'
                tooltip: 'Record per-path response times for HTTP, CLI and MQ into the database.'
            priority: 80

        genaker_log_viewer.http_perf_tracked_statuses:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\TextType
            ui_only:   true
            options:
                label:   'Tracked HTTP Status Codes'
                tooltip: 'Comma-separated HTTP status codes to record (e.g. "200,201"). Leave empty to track all.'
                attr:
                    placeholder: '200'
            priority: 90

        genaker_log_viewer.http_perf_track_cli:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Track CLI Commands'
                tooltip: 'Record wall-clock time for each console command run.'
            priority: 100

        genaker_log_viewer.http_perf_track_mq:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Track RabbitMQ Messages'
                tooltip: 'Record processing time per MQ topic.'
            priority: 110

        genaker_log_viewer.http_perf_slow_threshold_ms:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'HTTP Slow Request Threshold (ms, 0 = log all)'
                tooltip: 'Only record HTTP/CLI/MQ requests slower than this threshold. 0 logs everything.'
                attr:
                    min: 0
                    placeholder: '0'
            priority: 115

        genaker_log_viewer.sql_tracking_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable SQL Issue Tracking (N+1 & slow queries)'
                tooltip: 'Detect N+1 query patterns and slow queries per request. Zero DB overhead on clean requests.'
            priority: 120

        genaker_log_viewer.sql_n1_threshold:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'N+1 Detection Threshold (min repeat count per request)'
                tooltip: 'Flag a SQL template as N+1 when it is executed more than this many times in a single request.'
                attr:
                    min: 2
                    placeholder: '5'
            priority: 125

        genaker_log_viewer.sql_slow_threshold_ms:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Slow Query Threshold (ms)'
                tooltip: 'Flag a SQL execution as slow when it exceeds this duration.'
                attr:
                    min: 1
                    placeholder: '10'
            priority: 130

        genaker_log_viewer.sql_ai_api_key:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\PasswordType
            ui_only:   true
            options:
                label:   'AI Analysis API Key (OpenAI / compatible)'
                tooltip: 'OpenAI API key (sk-...). Leave empty to disable AI-powered SQL recommendations. The key is stored in the database configuration.'
                attr:
                    placeholder: 'sk-...'
                    autocomplete: 'off'
            priority: 135

        genaker_log_viewer.sql_ai_api_url:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\TextType
            ui_only:   true
            options:
                label:   'AI API URL'
                tooltip: 'Override to use Azure OpenAI, local Ollama, or any OpenAI-compatible endpoint. Leave empty for the default OpenAI chat completions URL.'
                attr:
                    placeholder: 'https://api.openai.com/v1/chat/completions'
            priority: 140

        genaker_log_viewer.sql_ai_model:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\TextType
            ui_only:   true
            options:
                label:   'AI Model'
                tooltip: 'Model name to use for SQL analysis (e.g. gpt-4o-mini, gpt-4o, claude-3-haiku). Leave empty for the default (gpt-4o-mini).'
                attr:
                    placeholder: 'gpt-4o-mini'
            priority: 145

        genaker_log_viewer.browser_console_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Browser Console Logger'
                tooltip: 'Inject backend log data (API calls, debug info) into the browser developer console. Disable on production.'
            priority: 150

        genaker_log_viewer.browser_console_max_entries:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Console Logger Max Entries'
                tooltip: 'Maximum number of log entries per request. Excess entries are dropped with a truncation warning.'
                attr:
                    min: 1
                    max: 10000
                    placeholder: '200'
            priority: 155

        genaker_log_viewer.browser_console_max_size_kb:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Console Logger Max Payload (KB)'
                tooltip: 'Maximum total payload size in kilobytes injected into the page. Prevents response bloat from large log data.'
                attr:
                    min: 1
                    max: 10240
                    placeholder: '1024'
            priority: 160

        genaker_log_viewer.db_log_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Database Log Handler'
                tooltip: 'Write Monolog entries to the genaker_log_entry table. Disable on production to reduce DB load.'
            priority: 170

        genaker_log_viewer.db_log_level:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\ChoiceType
            ui_only:   true
            options:
                label: 'Database Log Minimum Level'
                tooltip: 'Only log entries at or above this level are written to the database.'
                choices:
                    'DEBUG':     DEBUG
                    'INFO':      INFO
                    'NOTICE':    NOTICE
                    'WARNING':   WARNING
                    'ERROR':     ERROR
                    'CRITICAL':  CRITICAL
                    'ALERT':     ALERT
                    'EMERGENCY': EMERGENCY
            priority: 175

        genaker_log_viewer.db_log_retention_hours:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Database Log Retention (hours)'
                tooltip: 'Entries older than this are deleted by the genaker:log-entry:cleanup cron command.'
                attr:
                    min: 1
                    max: 8760
                    placeholder: '24'
            priority: 180

        genaker_log_viewer.db_log_write_mode:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\ChoiceType
            ui_only:   true
            options:
                label: 'Database Log Write Mode'
                tooltip: 'File logging is always active (default Monolog behavior). This setting controls how the additional DB copy is written. Deferred: buffers entries and writes to DB after the response/command/MQ message finishes — zero impact on response time. Immediate: writes to DB inline — useful for debugging crashes where the process may die before flush.'
                choices:
                    'File + DB deferred (recommended)': deferred
                    'File + DB immediate': immediate
            priority: 185

        genaker_log_viewer.db_log_channels:
            data_type: string
            type:      Symfony\Component\Form\Extension\Core\Type\TextType
            ui_only:   true
            options:
                label:   'Database Log Channels (comma-separated)'
                tooltip: 'Only log entries from these Monolog channels are written to the database. Leave empty to log all channels. Example: app,security,doctrine'
                attr:
                    placeholder: '(all channels)'
            priority: 190

        genaker_log_viewer.db_log_max_size_mb:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Max Log Table Size (MB)'
                tooltip: 'When the genaker_log_entry table exceeds this size, oldest rows are automatically deleted on the next write cycle. Set to 0 to disable auto-truncation.'
                attr:
                    min: 0
                    max: 10240
                    placeholder: '500'
            priority: 195

        genaker_log_viewer.db_log_truncate_interval_min:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Auto-Truncation Check Interval (minutes)'
                tooltip: 'How often to check the table size and truncate if needed. Lower values = faster cleanup but slightly more DB overhead per write cycle. The check uses pg_total_relation_size() which is very fast.'
                attr:
                    min: 1
                    max: 1440
                    placeholder: '15'
            priority: 200

        genaker_log_viewer.db_log_grouping_enabled:
            data_type: boolean
            type:      Oro\Bundle\ConfigBundle\Form\Type\ConfigCheckbox
            ui_only:   true
            options:
                label:   'Enable Log Grouping (deduplicate)'
                tooltip: 'Group identical log entries by channel+level+message prefix instead of creating duplicate rows. The occurrence count is incremented and the latest context/URL/IP is kept. Dramatically reduces table size for repetitive logs.'
            priority: 205

        genaker_log_viewer.db_log_grouping_key_length:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Grouping Key Length (characters)'
                tooltip: 'Number of leading message characters used for the grouping key (combined with channel and level). Shorter = more aggressive grouping (more dedup). Longer = more precise grouping (fewer false merges). Default 30 works well for most Monolog messages.'
                attr:
                    min: 10
                    max: 255
                    placeholder: '30'
            priority: 210

        genaker_log_viewer.db_log_context_trim_length:
            data_type: integer
            type:      Symfony\Component\Form\Extension\Core\Type\IntegerType
            ui_only:   true
            options:
                label:   'Context Display Trim Length (characters)'
                tooltip: 'Truncate context JSON in the log viewer UI to this many characters. Click to expand. Set to 0 to show full context without truncation.'
                attr:
                    min: 0
                    max: 10000
                    placeholder: '100'
            priority: 215

    tree:
        system_configuration:
            platform:
                children:
                    general_setup:
                        children:
                            genaker_log_viewer_group:
                                children:
                                    genaker_log_viewer_settings:
                                        children:
                                            - genaker_log_viewer.enabled
                                            - genaker_log_viewer.lines_per_page
                                    genaker_perf_settings:
                                        children:
                                            - genaker_log_viewer.perf_dashboard_enabled
                                            - genaker_log_viewer.perf_report_interval
                                            - genaker_log_viewer.perf_http_reporting
                                            - genaker_log_viewer.perf_mq_reporting
                                            - genaker_log_viewer.perf_mq_trigger
                                            - genaker_log_viewer.http_perf_enabled
                                            - genaker_log_viewer.http_perf_tracked_statuses
                                            - genaker_log_viewer.http_perf_track_cli
                                            - genaker_log_viewer.http_perf_track_mq
                                            - genaker_log_viewer.http_perf_slow_threshold_ms
                                    genaker_sql_settings:
                                        children:
                                            - genaker_log_viewer.sql_tracking_enabled
                                            - genaker_log_viewer.sql_n1_threshold
                                            - genaker_log_viewer.sql_slow_threshold_ms
                                            - genaker_log_viewer.sql_ai_api_key
                                            - genaker_log_viewer.sql_ai_api_url
                                            - genaker_log_viewer.sql_ai_model
                                    genaker_browser_console_settings:
                                        children:
                                            - genaker_log_viewer.browser_console_enabled
                                            - genaker_log_viewer.browser_console_max_entries
                                            - genaker_log_viewer.browser_console_max_size_kb
                                    genaker_db_log_settings:
                                        children:
                                            - genaker_log_viewer.db_log_enabled
                                            - genaker_log_viewer.db_log_level
                                            - genaker_log_viewer.db_log_write_mode
                                            - genaker_log_viewer.db_log_channels
                                            - genaker_log_viewer.db_log_retention_hours
                                            - genaker_log_viewer.db_log_max_size_mb
                                            - genaker_log_viewer.db_log_truncate_interval_min
                                            - genaker_log_viewer.db_log_grouping_enabled
                                            - genaker_log_viewer.db_log_grouping_key_length
                                            - genaker_log_viewer.db_log_context_trim_length
